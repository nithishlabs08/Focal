name: focal_desktop
description: Focal receive-only desktop client for Linux, Windows, and macOS.
publish_to: "none"
version: 1.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  flutter_svg: ^2.0.17
  multicast_dns: ^0.3.3
  dbus: ^0.8.0
  media_kit: ^1.2.0
  media_kit_video: ^1.3.0
  media_kit_libs_linux: ^1.2.0
  media_kit_libs_windows_video: ^1.0.11
  media_kit_libs_macos_video: ^1.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/focal_mark.svg
    - assets/focal_icon.svg
