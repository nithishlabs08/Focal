name: CI & Release (Android & Desktop)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: v1.1.0

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: '9.3.1'

    - name: Run Unit Tests (Mobile & TV)
      run: gradle testMobileDebugUnitTest testTvDebugUnitTest --stacktrace

    - name: Generate LAN TLS keystore
      run: bash scripts/generate_lan_keystore.sh

    - name: Generate Release Keystore
      run: |
        keytool -genkeypair -v \
          -keystore release.keystore \
          -alias focal \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass focalrelease \
          -keypass focalrelease \
          -dname "CN=Focal, OU=Focal, O=Focal, L=Local, S=Local, C=US"

    - name: Build Split Architecture Release APKs (Mobile & TV)
      run: gradle assembleMobileRelease assembleTvRelease --stacktrace
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
        STORE_PASSWORD: focalrelease
        KEY_ALIAS: focal
        KEY_PASSWORD: focalrelease

    - name: Stage Release APKs
      run: |
        mkdir -p release-apks
        find app/build/outputs/apk -name "*release*.apk" -exec cp {} release-apks/ \;
        ls -la release-apks/

    - name: Upload Release APKs
      uses: actions/upload-artifact@v7
      with:
        name: focal-release-apks
        path: release-apks/*.apk

  desktop-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libblkid-dev liblzma-dev libsecret-1-dev \
            librsvg2-bin rpm \
            dpkg-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Bootstrap & test Focal Desktop
        working-directory: apps/focal_desktop
        run: |
          flutter create . --platforms=linux --project-name focal_desktop
          flutter pub get
          flutter analyze
          flutter test

      - name: Build .deb and .rpm
        working-directory: apps/focal_desktop
        run: bash packaging/build-deb-rpm.sh

      - name: Stage desktop packages
        run: |
          mkdir -p release-desktop
          cp -v apps/focal_desktop/build/dist/*.deb apps/focal_desktop/build/dist/*.rpm release-desktop/ || true
          ls -la release-desktop/

      - name: Upload desktop packages
        uses: actions/upload-artifact@v7
        with:
          name: focal-desktop-linux-packages
          path: release-desktop/*

  release:
    needs: [android, desktop-linux]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v7
        with:
          name: focal-release-apks
          path: release-apks

      - name: Download desktop package artifacts
        uses: actions/download-artifact@v7
        with:
          name: focal-desktop-linux-packages
          path: release-desktop

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          assets=(release-apks/*.apk release-desktop/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release assets found" >&2
            exit 1
          fi
          gh release delete "${RELEASE_TAG}" --yes || true
          gh release create "${RELEASE_TAG}" "${assets[@]}" \
            --title "Focal ${RELEASE_TAG} (Mobile, TV & Desktop)" \
            --notes "### Focal ${RELEASE_TAG}

          #### Android APKs

          **Focal Mobile** (camera / screen / audio host + receive)
          - **app-mobile-arm64-v8a-release.apk** — 64-bit ARM phones
          - **app-mobile-armeabi-v7a-release.apk** — 32-bit ARM phones
          - **app-mobile-universal-release.apk** — universal mobile APK
          - **app-mobile-x86_64-release.apk** / **app-mobile-x86-release.apk** — emulators

          **Focal TV** (receive + screen/audio host; no camera host)
          - **app-tv-arm64-v8a-release.apk**, **app-tv-armeabi-v7a-release.apk**, **app-tv-universal-release.apk**, **app-tv-x86_64-release.apk**

          #### Linux desktop (FOCL receiver)

          - **focal-desktop_*_amd64.deb** — Debian / Ubuntu (install: \`sudo apt install ./focal-desktop_*.deb\`)
          - **focal-desktop-*-1.x86_64.rpm** — Fedora / RHEL-compatible (install: \`sudo dnf install ./focal-desktop-*.rpm\`)

          Screen share from the desktop app requires **ffmpeg** on the host. Receive works with VLC for \`~/focal_capture.h264\`.

          #### Pairing
          - mDNS \`_focal._tcp.\` on LAN; **4-digit PIN** after connect."
