name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Run Unit Tests (Mobile & TV)
      run: gradle testMobileDebugUnitTest testTvDebugUnitTest --stacktrace

    - name: Generate LAN TLS keystore
      run: bash scripts/generate_lan_keystore.sh

    - name: Generate Release Keystore
      run: |
        keytool -genkeypair -v \
          -keystore release.keystore \
          -alias focal \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass focalrelease \
          -keypass focalrelease \
          -dname "CN=Focal, OU=Focal, O=Focal, L=Local, S=Local, C=US"

    - name: Build Split Architecture Release APKs (Mobile & TV)
      run: gradle assembleMobileRelease assembleTvRelease --stacktrace
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
        STORE_PASSWORD: focalrelease
        KEY_ALIAS: focal
        KEY_PASSWORD: focalrelease

    - name: Stage Release APKs
      run: |
        mkdir -p release-apks
        find app/build/outputs/apk -name "*release*.apk" -exec cp {} release-apks/ \;
        ls -la release-apks/

    - name: Upload Split Architecture APKs
      uses: actions/upload-artifact@v4
      with:
        name: focal-release-apks
        path: release-apks/*.apk

    - name: Publish GitHub Release
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release delete v1.1.0 --yes || true
        gh release create v1.1.0 release-apks/*.apk \
          --title "Focal v1.1.0 (Mobile Streamer & Android TV Viewer)" \
          --notes "### Focal v1.1.0 Release (Mobile & Android TV)

          #### 📱 Focal Mobile (Camera Streamer)
          *Turn your phone or tablet into a high-definition webcam for PC & TV.*
          - **app-mobile-arm64-v8a-release.apk**: Modern 64-bit ARM phones (Pixel, Galaxy, OnePlus, Xiaomi)
          - **app-mobile-armeabi-v7a-release.apk**: 32-bit ARM phones
          - **app-mobile-universal-release.apk**: Universal mobile APK
          - **app-mobile-x86_64-release.apk**: 64-bit Android emulators
          - **app-mobile-x86-release.apk**: 32-bit Android emulators

          #### 📺 Focal TV (Big-Screen Viewer & Monitor)
          *Stream your phone's camera live to your Android TV or tablet screen.*
          - **app-tv-armeabi-v7a-release.apk**: Chromecast with Google TV, Fire TV Stick 4K, Xiaomi TV Box
          - **app-tv-arm64-v8a-release.apk**: Nvidia Shield TV, Sony Bravia, premium Google TVs
          - **app-tv-universal-release.apk**: Universal TV & Tablet APK (works on any Android TV or tablet)
          - **app-tv-x86_64-release.apk**: Android TV emulators

          #### Features & Highlights
          - **Dual-Flavor Architecture**: Dedicated mobile streamer and lightweight TV client without camera bloat.
          - **Zero-Config mDNS Discovery**: Instant LAN auto-discovery with '_focal._tcp.' and remote-friendly 6-digit PIN pairing.
          - **Android TV Leanback Banner**: Native home screen launcher icon and full D-Pad remote navigation with LocalSend blue focus indicators.
          - **Hardware Acceleration**: Low-latency H.264 MediaCodec decoder and 48 kHz PCM audio passthrough to TV speakers.
          - **Native Picture-in-Picture (PiP)**: Keep your camera feed pinned in the corner of your TV while watching other apps."
