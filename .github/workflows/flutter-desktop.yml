name: Flutter Desktop

on:
  push:
    branches: [main]
    paths:
      - "apps/focal_desktop/**"
      - ".github/workflows/flutter-desktop.yml"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "apps/focal_desktop/**"
  workflow_dispatch:

jobs:
  test-and-build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libblkid-dev liblzma-dev libsecret-1-dev \
            librsvg2-bin rpm \
            dpkg-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Bootstrap platform folders
        working-directory: apps/focal_desktop
        run: |
          flutter create . --platforms=linux --project-name focal_desktop
          flutter pub get

      - name: Analyze & test
        working-directory: apps/focal_desktop
        run: |
          flutter analyze
          flutter test

      - name: Build .deb and .rpm
        working-directory: apps/focal_desktop
        run: bash packaging/build-deb-rpm.sh

      - uses: actions/upload-artifact@v7
        with:
          name: focal-desktop-linux-packages
          path: |
            apps/focal_desktop/build/dist/*.deb
            apps/focal_desktop/build/dist/*.rpm
